<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="postFragment" class="container container-background mx-auto post"
     style="max-width: 1000px; margin-top: 20px;">

    <div class="d-flex justify-content-between align-items-center container container-background"
         style="gap: 10px;">
        <div class="d-flex align-items-center justify-content-center" style="gap: 10px;">
            <img class="post-header-img"
                 th:src="@{${post.author.avatarUrl != null} ? ${post.author.avatarUrl} : '/profile/default-avatar.jpg'}"
                 alt="author avatar">
            <p class="main-text">[[${post.author.username}]]</p>
        </div>
        <button class="btn btn-light button-sbc"
                th:if="${post.author.id != currentUser.id}"
                th:onclick="followUser([[${post.author.id}]])">
            Subscribe
        </button>
    </div>

    <div class="container container-background">
        <div class="d-flex align-items-center justify-content-center container-background">
            <img class="post-inf-publication-img"
                 th:src="@{${post.imageUrl}}"
                 alt="post image" style="max-width: 100%;">
        </div>
        <p class="sub-text" th:text="${post.content}"></p>
    </div>

</div>
</html>
