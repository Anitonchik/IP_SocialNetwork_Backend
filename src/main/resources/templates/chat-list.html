<!DOCTYPE html>
<html
        lang="ru"
        th:attr="data-bs-theme=${@themeUtil.getTheme()}"
        class="h-100"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title layout:title-pattern="$LAYOUT_TITLE - $CONTENT_TITLE">Social Network</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
    <th:block layout:fragment="css"></th:block>
</head>

<body>
<!-- Хедер с информацией о чате -->
<nav class="navbar navbar-light bg-light" style="max-width: 1000px; margin: auto;">
    <div class="container-fluid">
        <div class="d-flex align-items-center">
            <img th:src="${chat.correspondenceUser.userAvatarURL}"
                 style="width: 40px; height: 40px; border-radius: 50%; margin-right: 10px;">
            <span class="navbar-brand mb-0 h6" th:text="${chat.correspondenceUser.userName}"></span>
        </div>
    </div>
</nav>

<div class="chat-container d-flex flex-column">
    <!-- Блок сообщений -->
    <div class="messages-container container-background flex-grow-1">
        <div th:each="msg : ${messages}">
            <!-- Дата -->
            <div th:if="${msg.showDate}" class="d-block text-center">
                <div class="date-message-text"
                     th:text="${msg.day + ' ' + msg.month}"></div>
            </div>

            <!-- Сообщение -->
            <div th:classappend="${msg.sender == 'your' ? 'your-message' : 'stranger-message'}"
                 class="d-block"
                 th:data-message-id="${msg.id}">

                <div class="message-chat-text" th:text="${msg.messageText}"></div>

                <div class="message-chat-time">
                    <span th:if="${msg.edited}">edited </span>
                    <span th:text="${msg.time}"></span>
                </div>

                <!-- Контекстное меню для своих сообщений -->
                <div th:if="${msg.sender == 'your'}" class="dropdown position-absolute top-0 end-0">
                    <button class="btn btn-link text-dark p-0"
                            type="button"
                            data-bs-toggle="dropdown"
                            style="transform: translate(10px, -10px);">
                        <i class="bi bi-three-dots-vertical"></i>
                    </button>
                    <ul class="dropdown-menu">
                        <li>
                            <button class="dropdown-item"
                                    onclick="editMessage([[${msg.id}]])">
                                <i class="bi bi-pencil"></i> Edit
                            </button>
                        </li>
                        <li>
                            <form th:action="@{/chat/delete-message/{id}(id=${msg.id})}"
                                  method="post"
                                  onsubmit="return confirm('Delete this message?')">
                                <input type="hidden" name="chatId" th:value="${chat.id}">
                                <button class="dropdown-item text-danger" type="submit">
                                    <i class="bi bi-trash"></i> Delete
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Форма отправки сообщения -->
    <div th:if="${chat != null}" class="message-input-container">
        <form th:action="@{/chat/send}" method="post" id="messageForm">
            <input type="hidden" name="chatId" th:value="${chat.id}">
            <div class="d-flex align-items-center justify-content-between">
                <div style="flex-grow: 1; margin-right: 15px;">
                        <textarea name="messageText"
                                  id="messageText"
                                  placeholder="Message"
                                  rows="2"
                                  oninput="autoResize(this)"
                                  onkeydown="handleKeyDown(event)"></textarea>
                </div>
                <div class="send-button">
                    <button type="button" onclick="sendMessage()">
                        <i class="bi bi-chevron-double-right"></i>
                    </button>
                </div>
            </div>
        </form>
    </div>

    <!-- Форма редактирования (скрытая) -->
    <div th:if="${isEditing}" class="message-input-container">
        <form th:action="@{/chat/edit/{id}(id=${editMessage.id})}" method="post" id="editForm">
            <input type="hidden" name="chatId" th:value="${chat.id}">
            <div class="d-flex align-items-center">
                <input type="text"
                       name="messageText"
                       th:value="${editMessage.messageText}"
                       class="form-control me-2">
                <button type="submit" class="btn btn-primary me-2">Save</button>
                <button type="button" class="btn btn-secondary" onclick="cancelEdit()">Cancel</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Авторесайз textarea
    function autoResize(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
    }

    // Обработка Enter для отправки
    function handleKeyDown(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    }

    // Отправка сообщения
    function sendMessage() {
        const form = document.getElementById('messageForm');
        const textarea = document.getElementById('messageText');

        if (textarea.value.trim()) {
            form.submit();
        }
    }

    // Редактирование сообщения
    function editMessage(messageId) {
        // Можно реализовать AJAX запрос или показать форму редактирования
        const messageDiv = document.querySelector(`[data-message-id="${messageId}"]`);
        const messageText = messageDiv.querySelector('.message-chat-text').textContent;

        // Заполняем форму редактирования
        document.querySelector('#editForm input[name="messageText"]').value = messageText;
        document.querySelector('#editForm').style.display = 'block';
        document.querySelector('#messageForm').style.display = 'none';
    }

    function cancelEdit() {
        document.querySelector('#editForm').style.display = 'none';
        document.querySelector('#messageForm').style.display = 'flex';
    }

    // Прокрутка вниз при загрузке
    window.onload = function() {
        const messagesContainer = document.querySelector('.messages-container');
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    };
</script>
</body>
</html>
