<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Пользователи</title>

    <!-- Bootstrap CSS через CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body class="background">
<nav class="navbar navbar-light bg-light mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">Социальная сеть</a>
        <span class="navbar-text">
                Страница: <span th:text="${currentPage}">1</span> из <span th:text="${totalPages}">1</span>
            </span>
    </div>
</nav>

<div class="container d-flex justify-content-between align-items-center p-2 gap-5 mt-0 mb-0">

    <!-- Список пользователей -->
    <div id="usersContainer">
        <div th:each="user : ${users}" class="d-flex align-items-center profile-message container container-background"
        style="width: 1000px; padding: 10px 10px 10px 10px">
           <!-- <div class="d-flex align-items-center profile-message">-->
                <img th:src="${user.userAvatarURL ?: '/static/default-avatar.png'}"
                     class="profile"
                     alt="Аватар">
                <div class="main-text justify-content-center mb-1" th:text="${user.userName}"></div>

        </div>
    </div>


    <!-- Традиционная пагинация (номера страниц) -->
    <div th:if="${totalPages > 1}" class="pagination-container">
        <nav aria-label="Page navigation">
            <ul class="pagination justify-content-center">
                <!-- Кнопка "Назад" -->
                <li class="page-item" th:classappend="${!hasPrevious} ? 'disabled' : ''">
                    <a class="page-link"
                       th:href="${hasPrevious} ? @{/users(page=${currentPage - 1}, size=${pageSize})} : '#'">
                        Назад
                    </a>
                </li>

                <!-- Номера страниц -->
                <li th:each="pageNum : ${#numbers.sequence(1, totalPages)}"
                    class="page-item"
                    th:classappend="${pageNum == currentPage} ? 'active' : ''">
                    <a class="page-link"
                       th:href="@{/users(page=${pageNum}, size=${pageSize})}"
                       th:text="${pageNum}">
                        1
                    </a>
                </li>

                <!-- Кнопка "Вперед" -->
                <li class="page-item" th:classappend="${!hasNext} ? 'disabled' : ''">
                    <a class="page-link"
                       th:href="${hasNext} ? @{/users(page=${currentPage + 1}, size=${pageSize})} : '#'">
                        Вперед
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Выбор размера страницы -->
        <div class="text-center mt-3">
            <small class="text-muted">Показывать по:</small>
            <div class="btn-group btn-group-sm ms-2">
                <a th:each="sizeOption : ${[5, 10, 20, 50]}"
                   class="btn btn-outline-secondary"
                   th:classappend="${size == sizeOption} ? 'active' : ''"
                   th:href="@{/users(page=1, size=${sizeOption})}"
                   th:text="${sizeOption}">
                    10
                </a>
            </div>
        </div>
    </div>

    <!-- Сообщение, если пользователей нет -->
    <div th:if="${users.empty}" class="text-center mt-5">
        <div class="alert alert-warning">
            <i class="bi bi-people h1"></i>
            <h4>Пользователи не найдены</h4>
        </div>
    </div>
</div>

<!-- JavaScript для бесконечного скролла (как в React) -->
<script>
    // Данные из Thymeleaf
    const currentPage = [[${currentPage}]];
    const totalPages = [[${totalPages}]];
    const nextPage = [[${nextPage}]];
    const isLastPage = [[${isLastPage}]];
    const pageSize = [[${pageSize}]];

    let isFetching = false;

    // Обработчик скролла
    function scrollHandler() {
        // Проверяем, доскролили ли до конца страницы
        const scrollHeight = document.documentElement.scrollHeight;
        const scrollTop = document.documentElement.scrollTop;
        const clientHeight = document.documentElement.clientHeight;

        // Если до конца осталось меньше 100px и не последняя страница
        if ((scrollHeight - (scrollTop + clientHeight) < 100)
            && !isFetching
            && !isLastPage) {

            loadMoreUsers();
        }
    }

    // Загрузка следующих пользователей
    async function loadMoreUsers() {
        if (isFetching || isLastPage) return;

        isFetching = true;
        document.getElementById('loadingSpinner').style.display = 'block';

        try {
            // AJAX запрос на сервер
            const response = await fetch(`/api/users/more?page=${nextPage}&size=${pageSize}`);
            const data = await response.json();

            // Добавляем новых пользователей в DOM
            appendUsers(data.items);

            // Обновляем данные пагинации
            updatePagination(data);

        } catch (error) {
            console.error('Ошибка загрузки пользователей:', error);
        } finally {
            isFetching = false;
            document.getElementById('loadingSpinner').style.display = 'none';
        }
    }

    // Добавление пользователей в DOM
    function appendUsers(users) {
        const container = document.getElementById('usersContainer');

        users.forEach(user => {
            const userCard = `
                <div class="user-card">
                    <div class="d-flex align-items-center">
                        <img src="${user.userAvatarURL || '/static/default-avatar.png'}"
                             class="user-avatar me-3"
                             alt="Аватар">
                        <div class="flex-grow-1">
                            <h5 class="mb-1">${user.userName}</h5>
                            <p class="text-muted mb-1">${user.email}</p>
                            <small class="text-muted">
                                Зарегистрирован: ${new Date(user.createdAt).toLocaleDateString()}
                            </small>
                        </div>
                        <div>
                            <button class="btn btn-outline-primary btn-sm">Написать</button>
                        </div>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', userCard);
        });
    }

    // Обновление данных пагинации
    function updatePagination(data) {
        window.nextPage = data.hasNext ? window.nextPage + 1 : window.nextPage;
        window.isLastPage = !data.hasNext;
    }

    // Инициализация скролла
    document.addEventListener('DOMContentLoaded', function() {
        window.addEventListener('scroll', scrollHandler);
    });

    // Очистка при размонтировании
    window.addEventListener('beforeunload', function() {
        window.removeEventListener('scroll', scrollHandler);
    });
</script>

<!-- Bootstrap JS -->
<script src="/webjars/bootstrap/5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
