databaseChangeLog:
  # Создание администратора
  - changeSet:
      id: insert-admin-user
      author: Anita
      preConditions:
        - onFail: MARK_RAN
      changes:
        - insert:
            tableName: users
            columns:
              - column:
                  name: first_name
                  value: Admin
              - column:
                  name: last_name
