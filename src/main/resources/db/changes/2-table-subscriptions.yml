databaseChangeLog:
  - changeSet:
      id: create-table-subscriptions
      author: Anita
      changes:
        - createTable:
            tableName: SUBSCRIPTIONS
            columns:
              - column:
                  name: SUBSCRIBEDUSERID
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: USERID
                  type: BIGINT
                  constraints:
                    nullable: false